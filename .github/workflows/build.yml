name: "publish"

on:
  push:
    tags:
      - v*

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: "ubuntu-latest" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: get_version
        uses: battila7/get-version-action@v2

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"


      - name: Install Rust stable(linux)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, x86_64-unknown-linux-gnu

      - name: Install Rust stable(windows)
        if: matrix.platform == 'windows-latest' # This must match the platform
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: Setup Android SDK
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        run: sdkmanager "ndk;29.0.13599879"

      - name: Initialize repos
        run: |
          make init-workflow
          mkdir ./release

      - name: Build Web
        run: make build-web


      - name: Build Server
        run: |
          make build-server

      - name: Build Tauri Desktop
        run: make build-tauri-desktop

      - name: Setup Android signing
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        run: |
          cd ./tauri/src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          echo "storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> key.properties
          echo "key.properties created."
          cd ../../../.. # Go back to root

      - name: Build Tauri Android
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        run: make build-tauri-android
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13599879

      - name: Prepare For Release(linux)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform
        run: |
          mv target/release/chnots-server ./release/chnot-server-${{ steps.get_version.outputs.version }}-gnu_linux-${{ runner.arch }}
          find ./target -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -exec mv -t ./release {} \;
          find ./tauri/src-tauri/gen/android/app/build/outputs/ -type f \( -name "*apk" -o -name "*aab" \) -exec sh -c 'mv {} "./release/$(echo {} | awk -F / "{print \$NF}"|sed "s/^app/Chnots-${{ steps.get_version.outputs.version }}/g")"' \;

      - name: Prepare For Release(windows)
        if: matrix.platform == 'windows-latest' # This must match the platform
        run: |
          mv target/release/chnots-server.exe       ./release/chnot-server-${{ steps.get_version.outputs.version }}-windows-${{ runner.arch }}.exe
          mv target/release/bundle/msi/Chnots*msi   ./release/
          mv target/release/bundle/nsis/Chnots*exe  ./release/

      - name: Upload scheduler binary
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
          tag_name: ${{ steps.get_version.outputs.version }}
