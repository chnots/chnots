[package]
name = "chnots-core"
version = "0.0.101"
edition = "2024"

[dependencies]
futures = "0.3.30"
num-traits = "0.2"
num-derive = "0.4"
uuid = "1.11.0"
lazy-regex = "3.4.1"
regex = "1.11.1"
arc-swap = "1.7.1"
axum-macros = "0.5.0"
env_logger = "0.11.6"
once_cell = "1.20.2"
textdistance = "1.1.1"
base64 = "0.22.1"
chinese-lunisolar-calendar = "0.2.0"
itertools = "0.14.0"
axum_typed_multipart = "0.16.2"
blake3 = "1.8.2"
enum-tag = "0.3.0"
const_format = "0.2.34"
shellexpand = "3.1.1"
enum-iterator = "2.1.0"
comrak = "0.41.0"
flate2 = "1.1.8"
hex = "0.4.3"

[features]
default = [ "axum-server",]
tls = [ "axum-server?/tls-rustls",]
tauri = []

[dependencies.log]
workspace = true

[dependencies.axum]
version = "0.8"
default-features = false
features = [ "multipart", "form", "http1", "json", "matched-path", "original-uri", "query", "tokio",]

[dependencies.tower-http]
version = "^0"
features = [ "cors", "trace", "set-header", "compression-full",]

[dependencies.mime_guess]
version = "2"

[dependencies.rust-embed]
version = "^8"
features = [ "axum", "compression",]

[dependencies.bytes]
version = "^1"
optional = true

[dependencies.tokio]
workspace = true

[dependencies.tokio-util]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.chrono]
version = "0.4.39"

[dependencies.tokio-postgres]
version = "0.7"
features = [ "with-chrono-0_4",]

[dependencies.postgres-types]
version = "0.2"

[dependencies.deadpool-postgres]
version = "0.14.0"

[dependencies.serde-pgrow]
version = "0.3.6"

[dependencies.chin-tools]
path = "../chin-tools/crates/chin-tools"

[dependencies.chin-sql]
path = "../chin-tools/crates/chin-sql"

[dependencies.actor-sqlite]
path = "../chin-tools/crates/actor-sqlite"

[dependencies.anyhow]
version = "1"
features = [ "backtrace",]

[dependencies.debug-ignore]
version = "1.0.5"
features = [ "serde",]

[dependencies.smol_str]
version = "0.3.2"
features = [ "serde",]

[dependencies.axum-server]
version = "0.7.1"
optional = true

[dependencies.reqwest]
version = "0.12.22"
default-features = false
features = [ "json", "stream", "multipart", "rustls-tls",]
