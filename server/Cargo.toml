[package]
name = "chnots"
version = "0.1.0"
edition = "2021"

[dependencies]

## Logger
log = "0.4.27"
tracing = "0.1"
tracing-subscriber = "0.3"

## Web Server
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "^0", features = [
    "cors",
    "trace",
    "set-header",
    "compression-full",
] }

mime_guess = { version = "2" }

# to embed frontend into the server
# with compression to have a smaller embedded data.
rust-embed = { version = "^8", features = ["axum", "compression"] }
bytes = { version = "^1", optional = true }


## Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "rt"] }
tokio-util = "0.7.10"
futures = "0.3.30"


## serde
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135" }


## Config or Arguments
toml = "0.8.10"
clap = { version = "4.4.10", features = ["derive"] }

## Time handler
chrono = { version = "0.4.39" }

# Db
## Postgres
tokio-postgres = { version = "0.7", optional = true, features = [
    "with-chrono-0_4",
] }
postgres-types = { version = "0.2", optional = true }
deadpool-postgres = { version = "0.14.0", optional = true }
serde-pgrow = { version = "0.3.6", optional = true }
kdb-derives = { path = "../tools/kdb-derives" }

# Misc
num-traits = "0.2"
num-derive = "0.4"

uuid = "1.11.0"

lazy-regex = "3.4.1"

chin-tools = { path = "../../chin-tools/crates/chin-tools" }
chin-sql = { path = "../../chin-tools/crates/chin-sql" }
actor-sqlite = { path = "../../chin-tools/crates/actor-sqlite" }


anyhow = { version = "1", features = ["backtrace"] }
strum = "0.26.3"
strum_macros = "0.26.4"
debug-ignore = { version = "1.0.5", features = ["serde"] }
regex = "1.11.1"
arc-swap = "1.7.1"
axum-macros = "0.5.0"

smol_str = { version = "0.3.2", features = ["serde"] }
env_logger = "0.11.6"
axum-server = { version = "0.7.1", features = ["tls-rustls"] }
once_cell = "1.20.2"
textdistance = "*"
base64 = "0.22.1"
chinese-lunisolar-calendar = "*"
itertools = "0.14.0"
axum_typed_multipart = "0.16.2"
blake3 = "1.8.2"
tracing-log = "0.2.0"
enum-tag = "0.3.0"


[features]
postgres = [
    "tokio-postgres",
    "postgres-types",
    "deadpool-postgres",
    "serde-pgrow",
]
default = ["postgres"]
