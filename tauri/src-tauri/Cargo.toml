[package]
name = "chnots-tauri"
version = "0.1.0"
description = "Chnots"
authors = ["org.codeberg.wangzh"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
tauri = { version = "2.6.2", features = [] }
tauri-plugin-log = "2"
chnots-core = { path = "../../backend/core", default-features = false, features = [
    "tauri",
] }
